<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hộp quà 20/10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Pacifico&display=swap">
<style>
/* Layout: nền bình minh, lời chúc ở trên, hộp quà đặt trên đồi cỏ phía dưới, hoa mọc từ miệng hộp */
:root {
  --sky-top: #cfe9ff;
  --sky-mid: #ffe6ef;
  --sky-bottom: #fff4e0;
  --ink: #4a1a35;
  --muted: #8a5a72;
  --accent: #e0407f;
  --font-display: 'Pacifico', 'Segoe Script', 'Brush Script MT', cursive;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  background-color: var(--sky-mid);
  background-image: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 55%, var(--sky-bottom));
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#sky {
  position: fixed;
  inset: 0;
  z-index: 0;
  display: block;
  touch-action: manipulation;
  cursor: pointer;
}
.open {
  position: fixed;
  z-index: 3;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  border-radius: 12px;
}
.open:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.top {
  position: relative;
  z-index: 2;
  display: grid;
  max-width: 34rem;
  margin: 0 auto;
  padding-block: clamp(20px, 5vh, 48px) 0;
  text-align: center;
  pointer-events: none;
}
.top > * { grid-area: 1 / 1; min-width: 0; }
.eyebrow {
  min-height: 1.2em;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
}
h1, h2 {
  margin: 0.3em 0 0.35em;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.7rem, 6.6vw, 2.7rem);
  line-height: 1.35;
  color: var(--ink);
  text-wrap: balance;
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.7);
}
.body, .lead {
  margin: 0 auto;
  max-width: 30rem;
  font-weight: 400;
  font-size: clamp(0.92rem, 2.7vw, 1.05rem);
  line-height: 1.7;
  color: var(--muted);
  text-wrap: pretty;
}
.lead { animation: pulse 2.4s ease-in-out infinite; }
.sign {
  margin-top: 0.4em;
  font-family: var(--font-display);
  font-size: 1.5rem;
  color: var(--accent);
}
.prompt { transition: opacity 0.5s ease; }
.prompt.gone { opacity: 0; }
.w { display: inline-block; white-space: nowrap; }
.c { display: inline-block; opacity: 0; transform: translateY(6px); filter: blur(3px); transition: opacity 0.5s ease, transform 0.5s ease, filter 0.5s ease; }
.c.on { opacity: 1; transform: none; filter: none; }
.hint {
  position: fixed;
  left: 0;
  right: 0;
  z-index: 2;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  color: #fff;
  text-shadow: 0 1px 6px rgba(30, 80, 40, 0.65);
  pointer-events: none;
  opacity: 0;
}
.hint.show { animation: hintin 1.2s ease 8s forwards; }
@keyframes hintin { to { opacity: 0.95; } }
@keyframes pulse { 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) {
  .c, .prompt { transition: none; }
  .lead { animation: none; }
  .hint.show { animation-delay: 0s; animation-duration: 0.01s; }
}
</style>

<canvas id="sky" aria-label="Hộp quà mở ra một bó hoa trên đồi cỏ"></canvas>
<div class="top">
  <div class="prompt" id="prompt">
    <div class="eyebrow" id="p0"></div>
    <h2 id="p1"></h2>
    <p class="lead">Có một món quà đang chờ em. Chạm vào hộp quà để mở.</p>
  </div>
  <main class="msg" id="msg">
    <div class="eyebrow" id="t0"></div>
    <h1 id="t1"></h1>
    <p class="body" id="t2"></p>
    <div class="sign" id="t3"></div>
  </main>
</div>
<button class="open" id="open" type="button" aria-label="Mở hộp quà"></button>
<div class="hint">Chạm vào màn hình để hoa nở thêm</div>

<script>
(function () {
  // ===== Sửa lời chúc ở đây =====
  var NAME = 'em yêu';
  var TEXT = [
    '20 tháng 10',
    'Chúc mừng 20/10, ' + NAME,
    'Hôm nay là 20/10. Anh không có nhiều lời hoa mỹ để dành tặng cho em, anh chỉ mong rằng em sẽ luôn bình an, luôn yên vui và hạnh phúc bên cạnh anh, anh sẽ cố gắng mang tới những nụ cười cho em không chỉ hôm nay mà cho tới mãi về sau.',
    'Mong em sẽ luôn yêu thương anh và ngày càng xinh đẹp.'
  ];
  // ==============================

  var cv = document.getElementById('sky');
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, DPR = 1;
  var bw = 0, bh = 0, cx = 0, boxBottom = 0, boxTop = 0, mouthY = 0, lh = 0, R0 = 30, spread = 100;
  var openBtn = document.getElementById('open');

  function layout() {
    bw = clamp(Math.min(W * 0.42, 190), 120, 210);
    bh = bw * 0.74; lh = bh * 0.26; cx = W / 2;
    boxBottom = H * 0.88; boxTop = boxBottom - bh; mouthY = boxTop + 6;
    R0 = clamp(Math.min(W, H) * 0.09, 26, 54);
    spread = Math.min(W * 0.34, bw * 1.5);
    openBtn.style.left = (cx - bw * 0.6) + 'px';
    openBtn.style.top = (boxTop - lh * 1.6) + 'px';
    openBtn.style.width = (bw * 1.2) + 'px';
    openBtn.style.height = (bh + lh * 1.6) + 'px';
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }

  // ----- helpers -----
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInOut(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function mix(a, b, t) {
    var x = rgb(a), y = rgb(b);
    return 'rgb(' + Math.round(x[0] + (y[0] - x[0]) * t) + ',' + Math.round(x[1] + (y[1] - x[1]) * t) + ',' + Math.round(x[2] + (y[2] - x[2]) * t) + ')';
  }
  function rgba(h, a) { var c = rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  window.addEventListener('resize', resize);
  resize();

  var FLOWERS = [
    { type: 'rose', pal: { core: '#6e0a1e', mid: '#d2203f', edge: '#ff6b82' } },
    { type: 'rose', pal: { core: '#a3154f', mid: '#f0508f', edge: '#ffb0cf' } },
    { type: 'rose', pal: { core: '#a3154f', mid: '#f0508f', edge: '#ffb0cf' } },
    { type: 'rose', pal: { core: '#c2386d', mid: '#ff8fb8', edge: '#ffe0ec' } },
    { type: 'rose', pal: { core: '#b0442a', mid: '#ff9a6e', edge: '#ffddc4' } },
    { type: 'rose', pal: { core: '#d98aa8', mid: '#fbd9e6', edge: '#ffffff' } },
    { type: 'rose', pal: { core: '#4f1a82', mid: '#a560d8', edge: '#e0bdf6' } },
    { type: 'tulip', pal: { core: '#a01450', mid: '#ec426f', edge: '#ffb3cc' } },
    { type: 'tulip', pal: { core: '#c78a00', mid: '#ffc62e', edge: '#fff0a0' } },
    { type: 'daisy', pal: { core: '#d9a02a', mid: '#fff6e0', edge: '#ffffff' } },
    { type: 'sunflower', pal: { core: '#75421c', mid: '#f2a51a', edge: '#ffdf62' } }
  ];
  var BABY = { type: 'baby', pal: { core: '#cdb8ee', mid: '#ffffff', edge: '#fff7ff' } };

  function leaf(p, ang, L) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
    var lg = ctx.createLinearGradient(0, 0, L, 0);
    lg.addColorStop(0, '#2a7451'); lg.addColorStop(1, '#5cbc88');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(L * 0.15, -L * 0.34, L * 0.62, -L * 0.36, L, 0);
    ctx.bezierCurveTo(L * 0.62, L * 0.36, L * 0.15, L * 0.34, 0, 0);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.09)';
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(L * 0.15, -L * 0.34, L * 0.62, -L * 0.36, L, 0);
    ctx.lineTo(0, 0); ctx.fill();
    ctx.strokeStyle = 'rgba(20,80,55,0.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L * 0.96, 0);
    for (var v = 1; v <= 4; v++) {
      var t = v * 0.19;
      ctx.moveTo(L * t, 0); ctx.lineTo(L * (t + 0.13), -L * 0.17 * (1 - t * 0.5));
      ctx.moveTo(L * t, 0); ctx.lineTo(L * (t + 0.13), L * 0.17 * (1 - t * 0.5));
    }
    ctx.stroke();
    ctx.restore();
  }

  function petalPath(L, wide) {
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-L * 0.62 * wide, -L * 0.12, -L * 0.82 * wide, -L * 0.72, -L * 0.36 * wide, -L * 0.96);
    ctx.quadraticCurveTo(0, -L * 1.04, L * 0.36 * wide, -L * 0.96);
    ctx.bezierCurveTo(L * 0.82 * wide, -L * 0.72, L * 0.62 * wide, -L * 0.12, 0, 0);
    ctx.closePath();
  }

  function rose(x, y, R, p, rot, pal) {
    var counts = [3, 5, 6, 7, 8, 9], n = counts.length;
    ctx.save(); ctx.translate(x, y);
    for (var k = n - 1; k >= 0; k--) {
      var kr = k / (n - 1);
      var lp = easeOut(clamp(p * 1.6 - (n - 1 - k) * 0.1, 0, 1));
      var rr = R * (0.22 + 0.78 * kr) * (0.3 + 0.7 * lp);
      var cnt = counts[k];
      var wide = 0.72 + 0.4 * lp * kr;
      var tip = mix(pal.mid, pal.edge, 0.25 + 0.75 * kr);
      if (k < n - 1) {
        var sg = ctx.createRadialGradient(0, 0, rr * 0.6, 0, 0, rr * 1.2);
        sg.addColorStop(0, 'rgba(40,0,25,0)'); sg.addColorStop(0.7, 'rgba(40,0,25,0.3)'); sg.addColorStop(1, 'rgba(40,0,25,0)');
        ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, 0, rr * 1.2, 0, 6.283); ctx.fill();
      }
      for (var i = 0; i < cnt; i++) {
        var a = rot + k * 0.9 + i * (Math.PI * 2 / cnt) + 0.12 * Math.sin(i * 3.1 + k);
        ctx.save(); ctx.rotate(a); ctx.translate(0, -rr * 0.1 * lp * kr);
        var g = ctx.createLinearGradient(0, 0, 0, -rr);
        g.addColorStop(0, pal.core); g.addColorStop(0.35, mix(pal.core, pal.mid, 0.7));
        g.addColorStop(0.75, pal.mid); g.addColorStop(1, tip);
        petalPath(rr, wide);
        ctx.fillStyle = g; ctx.fill();
        ctx.strokeStyle = rgba(pal.core, 0.4); ctx.lineWidth = 0.7; ctx.stroke();
        ctx.strokeStyle = rgba(pal.edge, 0.55); ctx.lineWidth = Math.max(1, R * 0.03);
        ctx.beginPath(); ctx.moveTo(-rr * 0.52 * wide, -rr * 0.9); ctx.quadraticCurveTo(0, -rr * 1.08, rr * 0.52 * wide, -rr * 0.9); ctx.stroke();
        ctx.strokeStyle = rgba(pal.core, 0.14); ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(-rr * 0.14, -rr * 0.12); ctx.quadraticCurveTo(-rr * 0.2, -rr * 0.5, -rr * 0.3 * wide, -rr * 0.86);
        ctx.moveTo(rr * 0.14, -rr * 0.12); ctx.quadraticCurveTo(rr * 0.2, -rr * 0.5, rr * 0.3 * wide, -rr * 0.86);
        ctx.stroke();
        ctx.restore();
      }
    }
    ctx.strokeStyle = rgba(pal.core, 0.8); ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (var s2 = 0; s2 <= 22; s2++) {
      var th = s2 * 0.55, r = R * 0.014 * s2 * (0.5 + 0.5 * p);
      var px = Math.cos(th + rot) * r, py = Math.sin(th + rot) * r;
      if (s2 === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }

  function simpleBloom(x, y, R, p, rot, pal, type) {
    var sun = type === 'sunflower';
    var count = sun ? 21 : 16;
    var L = R * (sun ? 0.98 : 0.92), wid = sun ? 0.17 : 0.13;
    var open = 0.25 + 0.75 * easeOut(p);
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    for (var layer = 0; layer < 2; layer++) {
      var off = layer ? Math.PI / count : 0, sc = layer ? 0.86 : 1;
      var len = L * sc * open, w = R * wid * sc * open * 1.7;
      var base = layer ? mix(pal.mid, pal.core, 0.3) : mix(pal.mid, pal.core, 0.12);
      for (var i = 0; i < count; i++) {
        ctx.save(); ctx.rotate(off + i * Math.PI * 2 / count);
        var g = ctx.createLinearGradient(0, -len * 0.1, 0, -len);
        g.addColorStop(0, base); g.addColorStop(1, mix(pal.mid, pal.edge, 0.7));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(0, -len * 0.12);
        ctx.bezierCurveTo(-w, -len * 0.3, -w * 0.9, -len * 0.85, 0, -len);
        ctx.bezierCurveTo(w * 0.9, -len * 0.85, w, -len * 0.3, 0, -len * 0.12);
        ctx.fill();
        ctx.strokeStyle = rgba(pal.core, 0.22); ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.moveTo(0, -len * 0.15); ctx.lineTo(0, -len * 0.85); ctx.stroke();
        ctx.restore();
      }
    }
    var c = R * (sun ? 0.36 : 0.2) * open;
    var cg = ctx.createRadialGradient(-c * 0.2, -c * 0.2, 0, 0, 0, c);
    if (sun) { cg.addColorStop(0, '#8a5a22'); cg.addColorStop(0.7, '#4a2a10'); cg.addColorStop(1, '#2e1a0b'); }
    else { cg.addColorStop(0, '#ffe064'); cg.addColorStop(1, '#e0a21a'); }
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, c, 0, 6.283); ctx.fill();
    var seeds = sun ? 70 : 24;
    for (var j = 0; j < seeds; j++) {
      var sr = c * 0.94 * Math.sqrt((j + 0.5) / seeds), sa = j * 2.39996;
      ctx.fillStyle = j % 2 ? 'rgba(255,210,120,0.4)' : 'rgba(0,0,0,0.22)';
      ctx.beginPath(); ctx.arc(Math.cos(sa) * sr, Math.sin(sa) * sr, Math.max(0.6, R * 0.02), 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }

  function tulip(x, y, R, p, rot, pal) {
    var open = 0.35 + 0.65 * easeOut(p);
    var wB = R * 0.58 * open, top = -R * 1.0, bot = R * 0.55;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot * 0.05 - 0.03);
    function petal(cx, tilt, sc, shade) {
      ctx.save(); ctx.translate(cx * open, 0); ctx.rotate(tilt * open);
      ctx.beginPath(); ctx.moveTo(0, bot);
      ctx.bezierCurveTo(-wB * sc, bot - R * 0.2, -wB * 1.05 * sc, top * 0.35, 0, top);
      ctx.bezierCurveTo(wB * 1.05 * sc, top * 0.35, wB * sc, bot - R * 0.2, 0, bot);
      var g = ctx.createLinearGradient(0, bot, 0, top);
      g.addColorStop(0, shade ? pal.core : mix(pal.core, pal.mid, 0.5));
      g.addColorStop(0.5, pal.mid); g.addColorStop(1, pal.edge);
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = rgba(pal.core, 0.4); ctx.lineWidth = 1; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = Math.max(1.2, R * 0.05);
      ctx.beginPath(); ctx.moveTo(-wB * 0.2 * sc, bot - R * 0.15);
      ctx.quadraticCurveTo(-wB * 0.35 * sc, (bot + top) / 2, -wB * 0.1 * sc, top * 0.82); ctx.stroke();
      ctx.restore();
    }
    petal(-R * 0.3, -0.22, 0.85, true);
    petal(R * 0.3, 0.22, 0.85, true);
    petal(0, 0, 1, false);
    ctx.restore();
  }

  function baby(x, y, R, p, rot) {
    var open = easeOut(p), pts = [];
    ctx.save(); ctx.translate(x, y);
    for (var j = 0; j < 10; j++) {
      var a = j * 2.4 + rot, d = R * 0.9 * Math.sqrt((j + 1) / 10) * (0.3 + 0.7 * open);
      pts.push([Math.cos(a) * d, Math.sin(a) * d, R * (0.16 + 0.04 * (j % 3)) * (0.4 + 0.6 * open)]);
    }
    ctx.strokeStyle = 'rgba(130,200,160,0.7)'; ctx.lineWidth = 0.8;
    ctx.beginPath();
    for (j = 0; j < pts.length; j++) { ctx.moveTo(0, 0); ctx.lineTo(pts[j][0], pts[j][1]); }
    ctx.stroke();
    for (j = 0; j < pts.length; j++) {
      ctx.fillStyle = j % 4 === 0 ? 'rgba(225,208,255,0.97)' : 'rgba(255,255,255,0.97)';
      ctx.beginPath(); ctx.arc(pts[j][0], pts[j][1], pts[j][2], 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,214,90,0.9)';
      ctx.beginPath(); ctx.arc(pts[j][0], pts[j][1], pts[j][2] * 0.32, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }

  function drawFlower(x, y, R, p, rot, flower) {
    if (flower.type === 'baby') baby(x, y, R, p, rot);
    else if (flower.type === 'tulip') tulip(x, y, R, p, rot, flower.pal);
    else if (flower.type === 'daisy' || flower.type === 'sunflower') simpleBloom(x, y, R, p, rot, flower.pal, flower.type);
    else rose(x, y, R, p, rot, flower.pal);
  }

  function paintHead(x, y, R, b, fl) {
    if (fl.type === 'rose' && b < 0.6) {
      var sa = clamp(1 - b * 1.7, 0, 1);
      ctx.save(); ctx.translate(x, y); ctx.globalAlpha = sa; ctx.fillStyle = '#3f9a6c';
      for (var q = 0; q < 5; q++) {
        ctx.save(); ctx.rotate(fl.rot + q * 1.2566);
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(R * 0.18, -R * 0.3, 0, -R * 0.62);
        ctx.quadraticCurveTo(-R * 0.18, -R * 0.3, 0, 0);
        ctx.fill(); ctx.restore();
      }
      ctx.restore();
    }
    drawFlower(x, y, R, b, fl.rot, fl);
    if (fl.type === 'rose' || fl.type === 'tulip') {
      var hr = R * 0.9;
      var hl = ctx.createRadialGradient(x - hr * 0.25, y - hr * 0.3, 0, x, y, hr);
      hl.addColorStop(0, 'rgba(255,255,255,' + (0.2 * b).toFixed(3) + ')'); hl.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hl; ctx.beginPath(); ctx.arc(x, y, hr, 0, 6.283); ctx.fill();
    }
  }

  function buildCache(fl, R, S) {
    var c = document.createElement('canvas');
    c.width = Math.ceil(S * DPR); c.height = Math.ceil(S * DPR);
    var main = ctx;
    ctx = c.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    try { paintHead(S / 2, S / 2, R, 1, fl); } finally { ctx = main; }
    fl.cache = { c: c, R: Math.round(R), d: DPR };
  }

  function drawHead(x, y, R, pop, b, fl) {
    if (b >= 0.999 && pop >= 0.999) {
      var S = Math.ceil(R * 2.6);
      if (!fl.cache || fl.cache.R !== Math.round(R) || fl.cache.d !== DPR) buildCache(fl, R, S);
      ctx.drawImage(fl.cache.c, x - S / 2, y - S / 2, S, S);
      return;
    }
    paintHead(x, y, R * pop, b, fl);
  }


  function heart(x, y, s, color, alpha) {
    ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha; ctx.fillStyle = color;

  // ----- scene data -----
  var clouds = [], wild = [], flies = [], petals = [], hearts = [], sparks = [], confetti = [], bflies = [];
  var i;

  for (i = 0; i < 60; i++) wild.push({ x: Math.random(), y: rnd(0.875, 0.99), c: ['#ffffff', '#ffd3e6', '#fff1a8', '#ffb0cf'][i % 4], r: rnd(1.6, 3) });
  for (i = 0; i < 16; i++) flies.push({ x: Math.random(), y: rnd(0.2, 0.8), ph: rnd(0, 6.28), sp: rnd(0.25, 0.6), r: rnd(1.2, 2.2) });
  var BCOL = [['#ff8fbd', '#ffc2da'], ['#ffd25e', '#fff0a8'], ['#8fc8ff', '#d3ebff'], ['#c79bff', '#e6d4ff'], ['#ff9a6e', '#ffd8bf'], ['#7fdcae', '#d4f6e4']];

  // ----- flowers -----
  var flowers = [];
  function makeFlower(ux, bu, nhy, start, size, variety, gd, bd) {
    return { ux: ux, bu: bu, nhy: nhy, start: start, gd: gd || 1.7, bd: bd || 2.4, size: size, type: variety.type, pal: variety.pal,
      ph: rnd(0, 6.28), rot: rnd(0, 6.28), sway: rnd(-1, 1), side: Math.random() < 0.5 ? 1 : -1,

  (function seed() {

    for (k = 0; k < N; k++) {

  function geo(f, t, bl) {

  // ----- text -----
  function buildText(prefix, items) {
    var out = [];
    items.forEach(function (str, idx) {

      host.setAttribute('aria-label', str);

        var w = document.createElement('span'); w.className = 'w'; w.setAttribute('aria-hidden', 'true');

        }
        host.appendChild(w);
      });
    });
    return out;
  }
  var chars = buildText('t', TEXT);
  var pchars = buildText('p', ['20 tháng 10', 'Gửi ' + NAME]);
  pchars.forEach(function (c) { c.className = 'c on'; });
  var typed = 0;
  function typeTo(n) {
    n = Math.min(n, chars.length);
    while (typed < n) { chars[typed].className = 'c on'; typed++; }
  }

  // ----- trạng thái -----
  var time = -1000, amb = 0, opened = false, burstDone = false, last = performance.now();
  var promptEl = document.getElementById('prompt');
  var hintEl = document.querySelector('.hint');

  function openBox() {

    hintEl.classList.add('show');
    openBtn.hidden = true;
  }
  openBtn.addEventListener('click', openBox);
  cv.addEventListener('pointerdown', function (e) {

    var nx = clamp(e.clientX / W, 0.05, 0.95), ny = clamp(e.clientY / H, 0.3, 0.8);
    var f = makeFlower(0, 0, ny, time, rnd(0.75, 1.15), FLOWERS[Math.floor(Math.random() * FLOWERS.length)], 1.0, 1.6);
    f.tap = true; f.abs = true; f.ground = true; f.nbx = nx + rnd(-0.05, 0.05); f.nhx = nx;
    flowers.push(f);

  // ----- hộp quà -----
  function drawBow(rw) {
    for (var sd = -1; sd <= 1; sd += 2) {
      ctx.save(); ctx.scale(sd, 1);
      var rg = ctx.createLinearGradient(0, 0, rw, 0);
      rg.addColorStop(0, '#fff6e6'); rg.addColorStop(1, '#ffe2bd');
      ctx.fillStyle = rg; ctx.strokeStyle = 'rgba(170,110,60,0.45)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, 0);

      ctx.bezierCurveTo(rw * 0.85, rw * 0.3, rw * 0.3, rw * 0.2, 0, 0);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#ffe9c8'; ctx.strokeStyle = 'rgba(170,110,60,0.5)';
    ctx.beginPath(); ctx.arc(0, 0, rw * 0.16, 0, 6.283); ctx.fill(); ctx.stroke();
  }

  function drawBody(ox, oy) {

    ctx.fillStyle = 'rgba(40,90,50,0.22)';
    ctx.beginPath(); ctx.ellipse(cx, boxBottom + 4, bw * 0.6, bh * 0.09, 0, 0, 6.283); ctx.fill();
    var g = ctx.createLinearGradient(x0, 0, x0 + bw, 0);
    g.addColorStop(0, '#ffa3c4'); g.addColorStop(0.5, '#ff86b3'); g.addColorStop(1, '#f26aa0');

    for (var h = 0; h < pos.length; h++) heart(x0 + bw * pos[h][0], y0 + bh * pos[h][1], 3.6, '#ffffff', 0.3);
    ctx.fillStyle = 'rgba(120,20,70,0.1)'; ctx.fillRect(x0 + 6, y0 + bh * 0.92, bw - 12, bh * 0.08);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0 + 12, y0 + 1); ctx.lineTo(x0 + bw - 12, y0 + 1); ctx.stroke();

    ctx.fillStyle = 'rgba(255,110,150,0.55)';
    ctx.beginPath(); ctx.ellipse(fx - bw * 0.28, ey + bw * 0.07, bw * 0.06, bw * 0.036, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(fx + bw * 0.28, ey + bw * 0.07, bw * 0.06, bw * 0.036, 0, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#5b2a45'; ctx.fillStyle = '#5b2a45'; ctx.lineWidth = Math.max(1.8, bw * 0.012); ctx.lineCap = 'round';

    ctx.restore();
  }

  // ----- khung hình -----
  function frame(now) {

    if (!reduce) amb += dt;
    if (opened && !reduce) time += dt;
    var i, k;

    // trời
    var sg = ctx.createLinearGradient(0, 0, 0, H);
    sg.addColorStop(0, '#cfe9ff'); sg.addColorStop(0.55, '#ffe6ef'); sg.addColorStop(1, '#fff4e0');

    sun.addColorStop(0, 'rgba(255,238,190,0.85)'); sun.addColorStop(1, 'rgba(255,238,190,0)');
    ctx.fillStyle = sun; ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(255,255,255,0.85)';

    hill(H * 0.86, H * 0.006, 3, 0, '#a9da9f', '#7fbf78');

    // quầng sáng sau bó hoa

      ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
    }

    // hoa
    var list = flowers.slice().sort(function (a, b) { return a.nhy - b.nhy; });
    var state = [];
    for (i = 0; i < list.length; i++) {
      var f = list[i];
      var g = easeOut(clamp((time - f.start) / f.gd, 0, 1));
      var b = easeInOut(clamp((time - f.start - f.gd * 0.85) / f.bd, 0, 1));

    for (i = 0; i < state.length; i++) {

          sparks.push({ x: head.x, y: head.y, vx: Math.cos(spa) * sps, vy: Math.sin(spa) * sps - 15, life: 0, max: rnd(0.9, 1.5), s: rnd(2, 4.5), c: Math.random() < 0.5 ? '#ffcf5c' : '#ff9ec7' });
        }

    // hộp quà

    else if (time < 0.5) ox = Math.sin(time * 70) * 4 * (1 - time / 0.5);
    drawBody(ox, oy);

      for (k = 0; k < 90; k++) {

        confetti.push({ x: cx + rnd(-bw * 0.25, bw * 0.25), y: mouthY, vx: Math.cos(ca) * cs, vy: Math.sin(ca) * cs, rot: rnd(0, 6.28), vr: rnd(-8, 8), w: rnd(5, 10), h: rnd(3, 6), c: cols[k % cols.length], life: 0, max: rnd(2.6, 4.2), fl: rnd(0, 6.28) });
      }

      cf.x += cf.vx * dt; cf.y += cf.vy * dt; cf.rot += cf.vr * dt;

        if (ba <= 0) continue;
        var bxp = W / 2 + Math.sin(amb * bf.sx + bf.ph) * W * bf.ax;
        var byp = H * bf.cy + Math.sin(amb * bf.sy + bf.ph * 2) * H * bf.ay;
        butterfly(bxp, byp, bf.sz, Math.cos(amb * bf.sx + bf.ph) * 0.45, amb * bf.fs + bf.ph, bf.c[0], bf.c[1], ba);
      }
    }

    // cánh hoa và lá rơi
    if (!reduce && time > 3) {
      var rate = clamp((time - 3) / 3, 0, 1);
      if (Math.random() < dt * 6 * rate && petals.length < 140) {
        var open = state.filter(function (z) { return z.b > 0.6 && z.hx !== undefined && z.f.type !== 'baby'; });
        if (open.length) {
          var z = open[Math.floor(Math.random() * open.length)];
          petals.push({ kind: Math.random() < 0.28 ? 'leaf' : 'petal', x: z.hx + rnd(-z.R, z.R) * 0.6, y: z.hy, vx: rnd(-14, 14), vy: rnd(22, 48), rot: rnd(0, 6.28), vr: rnd(-1.8, 1.8), s: rnd(5, 9.5), pal: z.f.pal, ph: rnd(0, 6.28), lc: Math.random() < 0.5 ? '#5cbc88' : '#3f9a6c' });
        }
      }
      if (Math.random() < dt * 4 * rate && petals.length < 140) {
        var fp = FLOWERS[Math.floor(Math.random() * FLOWERS.length)];
        petals.push({ kind: Math.random() < 0.3 ? 'leaf' : 'petal', x: rnd(0, W), y: -12, vx: rnd(-16, 16), vy: rnd(28, 60), rot: rnd(0, 6.28), vr: rnd(-1.8, 1.8), s: rnd(5, 10), pal: fp.pal, ph: rnd(0, 6.28), lc: Math.random() < 0.5 ? '#5cbc88' : '#3f9a6c' });
      }
    }
    for (i = petals.length - 1; i >= 0; i--) {
      var pt = petals[i];
      pt.y += pt.vy * dt; pt.x += (pt.vx + Math.sin(time * 1.5 + pt.ph) * 16) * dt; pt.rot += pt.vr * dt;
      if (pt.y > H * 0.93) { petals.splice(i, 1); continue; }
      ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot); ctx.scale(1, 0.35 + 0.65 * Math.abs(Math.cos(time * 2 + pt.ph)));
      ctx.globalAlpha = 0.92;
      if (pt.kind === 'leaf') {
        ctx.fillStyle = pt.lc; ctx.beginPath(); ctx.moveTo(-pt.s * 1.1, 0);
        ctx.quadraticCurveTo(0, -pt.s * 0.75, pt.s * 1.1, 0); ctx.quadraticCurveTo(0, pt.s * 0.75, -pt.s * 1.1, 0); ctx.fill();
        ctx.strokeStyle = 'rgba(20,80,55,0.5)'; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(-pt.s, 0); ctx.lineTo(pt.s, 0); ctx.stroke();
      } else {
        ctx.fillStyle = pt.pal.mid; ctx.beginPath(); ctx.ellipse(0, 0, pt.s, pt.s * 0.55, 0, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 0.55; ctx.fillStyle = pt.pal.edge;
        ctx.beginPath(); ctx.ellipse(-pt.s * 0.15, -pt.s * 0.1, pt.s * 0.55, pt.s * 0.28, 0, 0, 6.283); ctx.fill();
      }
      ctx.restore();
    }
    // tim bay lên
    if (!reduce && time > 4 && Math.random() < dt * 1.6 && hearts.length < 26) {
      hearts.push({ x: cx + rnd(-bw * 0.4, bw * 0.4), y: mouthY, vy: rnd(36, 70), s: rnd(5, 11), ph: rnd(0, 6.28), c: ['#ff7fb0', '#c79bff', '#ff9ec7', '#ffb3d1'][Math.floor(Math.random() * 4)] });
    }
    for (i = hearts.length - 1; i >= 0; i--) {
      var h = hearts[i];
      h.y -= h.vy * dt; h.x += Math.sin(time * 1.2 + h.ph) * 16 * dt;
      var ha = clamp((h.y - H * 0.25) / (H * 0.2), 0, 1) * 0.8;
      if (ha <= 0) { hearts.splice(i, 1); continue; }
      heart(h.x, h.y, h.s, h.c, ha);
    }
    // tia sáng
    for (i = sparks.length - 1; i >= 0; i--) {
      var sk = sparks[i];
      sk.life += dt; sk.x += sk.vx * dt; sk.y += sk.vy * dt; sk.vx *= 0.97; sk.vy = sk.vy * 0.97 + 20 * dt;
      var ska = clamp(1 - sk.life / sk.max, 0, 1);
      if (ska <= 0) { sparks.splice(i, 1); continue; }
      sparkle(sk.x, sk.y, sk.s * (0.5 + ska), sk.c, ska);
    }
    // phấn hoa lấp lánh
    for (i = 0; i < flies.length; i++) {
      var q = flies[i];
      var fx = q.x * W + Math.sin(amb * q.sp + q.ph) * 30, fy = q.y * H + Math.cos(amb * q.sp * 0.8 + q.ph) * 24;
      var fa = 0.2 + 0.6 * Math.pow(Math.sin(amb * 1.7 + q.ph), 2);
      var fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, q.r * 4);
      fg.addColorStop(0, 'rgba(255,214,120,' + (0.7 * fa).toFixed(3) + ')'); fg.addColorStop(1, 'rgba(255,214,120,0)');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(fx, fy, q.r * 4, 0, 6.283); ctx.fill();
    }

    // chữ
    if (!opened) { /* chờ mở hộp */ }
    else if (reduce) typeTo(chars.length);
    else if (time > 2.6) typeTo(Math.floor((time - 2.6) * 30));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
